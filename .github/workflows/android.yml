name: Build VX7 Marketing APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9 is required by AGP 8.7.x. No wrapper is committed, so this provides `gradle`.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      - name: Show the real error (only on failure)
        if: failure()
        shell: bash
        run: |
          echo "=========== COMPILER / GRADLE ERRORS ==========="
          grep -n -E "^e: |^w: .*error|What went wrong|Execution failed|FAILED|error:" -A8 build.log | head -200 || true

      - name: Name the APK
        run: |
          mkdir -p artifacts
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Built: $APK"
          cp "$APK" artifacts/VX7-Marketing.apk
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: VX7-Marketing.apk
          path: artifacts/VX7-Marketing.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
