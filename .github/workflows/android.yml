name: Build VX7 Marketing APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9 is required by AGP 8.7.x. No wrapper is committed, so this provides `gradle`.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Safety net: delete leftover files from the old project (e.g. Ui2.kt) that cause "Conflicting overloads".
      - name: Remove stale old-project files
        shell: bash
        run: |
          for d in app/src/main/java/com/vx7/marketing app/src/test/java/com/vx7/marketing; do
            [ -d "$d" ] || continue
            for f in "$d"/*.kt; do
              case "$(basename "$f")" in
                Backup.kt|Data.kt|Exporter.kt|MainActivity.kt|Notify.kt|Repo.kt|Ui.kt|UiCollections.kt|UiLists.kt|UiMisc.kt|UiProducts.kt|Util.kt|Vm.kt|BackupTest.kt|UtilTest.kt) ;;
                *) echo "Removing stale file: $f"; rm -f "$f" ;;
              esac
            done
          done

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      - name: Show the real error (only on failure)
        if: failure()
        shell: bash
        run: |
          echo "=========== COMPILER / GRADLE ERRORS ==========="
          grep -n -E "^e: |^w: .*error|What went wrong|Execution failed|FAILED|error:" -A8 build.log | head -200 || true

      - name: Name the APK
        run: |
          mkdir -p artifacts
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Built: $APK"
          cp "$APK" artifacts/VX7-Marketing.apk
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: VX7-Marketing.apk
          path: artifacts/VX7-Marketing.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
